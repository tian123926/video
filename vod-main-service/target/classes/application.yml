server:
  port: 8080

spring:
  application:
    name: vod-main-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/video_test_one?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

vod:
  minio-service:
    base-url: ${VOD_MINIO_SERVICE_URL:http://127.0.0.1:8081}
  service-token: ${VOD_SERVICE_TOKEN:vod-internal-token}
  auth:
    jwt-secret: ${VOD_JWT_SECRET:vod-default-jwt-secret-please-change-123456}
    jwt-expire-minutes: 10080
  play:
    sign-secret: ${VOD_PLAY_SIGN_SECRET:vod-play-sign-secret-please-change}
    expires-seconds: 1800
  api:
    public-base-url: ${VOD_API_PUBLIC_URL:http://127.0.0.1:8080}
