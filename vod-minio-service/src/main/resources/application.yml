server:
  port: 8081

spring:
  application:
    name: vod-minio-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/video_test_one?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB
  jackson:
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
  producer:
    group: vod-minio-producer-group

vod:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    presign-expiry-seconds: 1800
  service-token: ${VOD_SERVICE_TOKEN:vod-internal-token}
  auth:
    jwt-secret: ${VOD_JWT_SECRET:vod-default-jwt-secret-please-change-123456}
    enforce-paths: /api/video/upload/**
  upload:
    chunk-size: 5242880
    part-url-batch: 20
