apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/tian123926/video.git
    targetRevision: main
    path: deploy/k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: vod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
