apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vod

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - mysql.yaml
  - minio.yaml
  - redis.yaml
  - rocketmq.yaml
  - elasticsearch.yaml
  - milvus.yaml
  - canal.yaml
  - vod-ai-service.yaml
  - vod-main-service.yaml
  - vod-minio-service.yaml
  - vod-transcode-service.yaml
  - vod-tools.yaml
  - vod-gateway.yaml

configMapGenerator:
  - name: mysql-initdb
    files:
      - sql/schema.sql
    options:
      disableNameSuffixHash: true
