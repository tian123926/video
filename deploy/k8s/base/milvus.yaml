apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: milvus-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: milvus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: milvus
  template:
    metadata:
      labels:
        app: milvus
    spec:
      containers:
        - name: milvus
          image: milvusdb/milvus:v2.4.17
          command:
            - milvus
            - run
            - standalone
          env:
            # 内嵌 etcd，免部署 etcd 集群
            - name: ETCD_USE_EMBED
              value: "true"
            - name: ETCD_DATA_DIR
              value: /var/lib/milvus/etcd
            - name: ETCD_CONFIG_PATH
              value: /milvus/configs/advanced/etcd.yaml
            # 对象存储复用集群内 MinIO
            - name: COMMON_STORAGETYPE
              value: minio
            - name: MINIO_ADDRESS
              value: minio:9000
            - name: MINIO_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: vod-secret
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: vod-secret
                  key: MINIO_SECRET_KEY
            - name: MINIO_BUCKET_NAME
              value: milvus
            - name: COMMON_SECURITY_AUTHORIZATIONENABLED
              value: "false"
          ports:
            - name: grpc
              containerPort: 19530
            - name: metrics
              containerPort: 9091
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/milvus
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: milvus-data
---
apiVersion: v1
kind: Service
metadata:
  name: milvus
spec:
  type: NodePort
  selector:
    app: milvus
  ports:
    - name: grpc
      port: 19530
      targetPort: 19530
      nodePort: 30530
    - name: metrics
      port: 9091
      targetPort: 9091
