apiVersion: apps/v1
kind: Deployment
metadata:
  name: vod-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vod-gateway
  template:
    metadata:
      labels:
        app: vod-gateway
    spec:
      containers:
        - name: vod-gateway
          image: vod-gateway:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: vod-config
          ports:
            - containerPort: 8088
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8088
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8088
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: vod-gateway
spec:
  type: NodePort
  selector:
    app: vod-gateway
  ports:
    - port: 8088
      targetPort: 8088
      nodePort: 30080
