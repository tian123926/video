apiVersion: apps/v1
kind: Deployment
metadata:
  name: vod-minio-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vod-minio-service
  template:
    metadata:
      labels:
        app: vod-minio-service
    spec:
      containers:
        - name: vod-minio-service
          image: vod-minio-service:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: vod-config
            - secretRef:
                name: vod-secret
          ports:
            - containerPort: 8081
          readinessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 90
            periodSeconds: 20
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vod-minio-service
spec:
  selector:
    app: vod-minio-service
  ports:
    - port: 8081
      targetPort: 8081
