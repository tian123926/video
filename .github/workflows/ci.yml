name: build-and-push

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build jars
        run: mvn -B -DskipTests package

      - name: Login Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push images
        env:
          REGISTRY: ${{ secrets.HARBOR_REGISTRY }}
          PROJECT: ${{ secrets.HARBOR_PROJECT }}
        run: |
          set -e
          for svc in vod-gateway vod-main-service vod-minio-service vod-transcode-service; do
            img="$REGISTRY/$PROJECT/$svc"
            docker build -t "$img:${GITHUB_SHA}" -t "$img:latest" "$svc"
            docker push "$img:${GITHUB_SHA}"
            docker push "$img:latest"
          done
          img="$REGISTRY/$PROJECT/vod-tools"
          docker build -t "$img:${GITHUB_SHA}" -t "$img:latest" tools
          docker push "$img:${GITHUB_SHA}"
          docker push "$img:latest"

      - name: Update prod image refs
        if: github.event_name == 'push'
        env:
          REGISTRY: ${{ secrets.HARBOR_REGISTRY }}
          PROJECT: ${{ secrets.HARBOR_PROJECT }}
        run: |
          set -e
          file=deploy/k8s/overlays/prod/kustomization.yaml
          sed -i "s|harbor.example.com|$REGISTRY|g" "$file"
          sed -i "s|/vod/|/$PROJECT/|g" "$file"
          sed -i "s|newTag: .*|newTag: ${GITHUB_SHA}|g" "$file"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$file"
          if ! git diff --cached --quiet; then
            git commit -m "ci: deploy image tag ${GITHUB_SHA} [skip ci]"
            git push
          fi
