server:
  port: 8082

spring:
  application:
    name: vod-transcode-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/video_test_one?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}

rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

vod:
  minio-service:
    base-url: ${MINIO_SERVICE_BASE_URL:http://127.0.0.1:8081}
  service-token: ${VOD_SERVICE_TOKEN:vod-internal-token}
  transcode:
    ffmpeg-path: ${FFMPEG_PATH:ffmpeg}
    ffprobe-path: ${FFPROBE_PATH:ffprobe}
    temp-dir: ${TRANSCODE_TEMP_DIR:${java.io.tmpdir}/vod-transcode}
    tools-base-url: ${TRANSCODE_TOOLS_BASE_URL:}
    timeout-minutes: ${TRANSCODE_TIMEOUT_MINUTES:30}
